<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>บ้านสุข · Baan Suk Farm (Xmas)</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Pixelify+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#10261a;--pn:#1d4029;--rd:#c8322f;--gd:#f2c14e;--tx:#f4f8f4}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px 'Pixelify Sans',Kanit,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#lt{position:fixed;top:0;left:0;right:0;height:5px;z-index:5;background:repeating-linear-gradient(90deg,#c8322f 0 8px,#2f8f4a 8px 16px,#f2c14e 16px 24px,#3b8fd0 24px 32px);animation:bk 1.4s steps(2) infinite}
@keyframes bk{50%{filter:brightness(.55)}}
@media(prefers-reduced-motion:reduce){#lt{animation:none}}
#hud{width:100%;max-width:820px;display:flex;gap:6px;align-items:center;padding:10px 0 6px;flex-wrap:wrap}
#hud span{background:var(--pn);padding:4px 8px;border:2px solid #0a170f}
#hud i{flex:1}
button{font:inherit;color:var(--tx);background:var(--rd);border:2px solid #0a170f;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gd)}
#fr{position:relative;width:100%;max-width:820px}
canvas#c{width:100%;display:block;image-rendering:pixelated;border:3px solid #0a170f;background:#4f9a4a}
#ts{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#000c;padding:4px 10px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:92%}
#dl{position:absolute;left:0;right:0;bottom:0;background:#10261af5;border-top:3px solid var(--gd);padding:8px 10px}
#dl p{margin:4px 0 8px;line-height:1.45}
#dl button{margin:2px 4px 2px 0;background:var(--pn)}
#ct{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;padding:10px 4px}
.dp{display:grid;grid-template:repeat(3,50px)/repeat(3,50px);gap:2px}
.dp button{padding:0;font-size:18px;background:var(--pn);touch-action:none}
#a{width:88px;height:88px;border-radius:50%;font-size:24px;touch-action:none}
#hn{font-size:12px;opacity:.7;text-align:center}
#mn{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:10px;z-index:9}
#mn>div{background:var(--bg);border:3px solid var(--gd);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:8px}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tb .on,.r.on,.o.on{background:var(--gd);color:#10261a}
.r{display:block;width:100%;text-align:left;margin:3px 0;background:var(--pn)}
.o{display:inline-block;margin:2px;background:var(--pn)}
#mn p{margin:8px 0 2px;color:var(--gd)}
</style></head><body>
<div id="lt"></div>
<div id="hud"><span id="hm"></span><span id="hp"></span><span id="hd"></span><i></i><button onclick="M()">☰</button><button onclick="Lg()">TH/EN</button></div>
<div id="fr"><canvas id="c" width="320" height="192"></canvas><div id="ts"></div><div id="dl" hidden></div></div>
<div id="ct">
<div class="dp"><i></i><button data-k="u">▲</button><i></i><button data-k="l">◀</button><i></i><button data-k="r">▶</button><i></i><button data-k="d">▼</button><i></i></div>
<button id="a" onclick="act()">A</button></div>
<div id="hn"></div>
<div id="mn" hidden><div id="mb"></div></div>
<script>
const $=q=>document.querySelector(q),c=$('#c'),mn=$('#mn'),dl=$('#dl'),ts=$('#ts');
let g=c.getContext('2d'),fr=0,lt=0,cx=0,cy=0,CH=[],S,tmo,K={l:0,r:0,u:0,d:0},sn=[];
const W=32,H=24,T=16,VW=20,VH=12,SK='bsf1',DX=[0,-1,1,0],DY=[1,0,0,-1];
const t=a=>a[S.lg],pick=a=>a[Math.random()*a.length|0];
const R=(x,y,w,h,f)=>{g.fillStyle=f;g.fillRect(Math.round(x),Math.round(y),w,h)};
// ---- data ----  [th,en,...]
const CR=[['ผักบุ้ง','Morning glory',5,12,15,'#3fbf5a'],['พริก','Chili',10,28,30,'#e0282e'],['กะเพรา','Holy basil',15,42,45,'#2f7d3a'],['ฟักทอง','Pumpkin',30,95,80,'#f08a24'],['พอยน์เซเทีย','Poinsettia',25,70,60,'#d1121f']];
const BD=[['เพิงขายของ','Market stall',150,20,1,2],['บ้านไม้','Wood house',400,0,3,2],['เรือนไทย','Thai house',1500,40,12,2],['ต้นคริสต์มาส','Xmas tree',80,0,2,1]];
const VE=[['ตุ๊กตุ๊ก','Tuk-tuk',600,1.4,'#f2c14e'],['กระบะ','Pickup',2500,1.8,'#c8322f'],['เลื่อนซานต้า','Sleigh',5000,2.3,'#8b2a2a']];
const HT=[['ไม่ใส่','None',0],['หมวกซานต้า','Santa hat',120],['งอบ','Straw hat',60],['เขากวาง','Antlers',150],['หมวกไหมพรม','Beanie',80],['มงกุฎ','Crown',500]];
const SH=[['เสื้อขาว','White',0,'#e8ece8'],['เสื้อแดงคริสต์มาส','Xmas red',40,'#c8322f'],['เสื้อเขียว','Green',40,'#2f8f4a'],['ม่อฮ่อม','Indigo',50,'#2b3f7a'],['ชุดไทยทอง','Gold',200,'#e0a82e'],['เสื้อสก็อต','Tartan',70,'#8b2a2a']];
const AC=[['ไม่ใส่','None',0],['ผ้าพันคอ','Scarf',50],['แว่นตา','Glasses',40],['สายไฟกระพริบ','Lights',90]];
const HC=['#2a1c14','#6b3b1c','#e0b040','#c8322f','#e8e8e8'],SKN=['#f1c9a0','#d9a577','#a9744a','#6e4529'];
const TN={s:['เมล็ด','Seeds'],b:['สร้าง','Build'],w:['แต่งตัว','Wear'],v:['รถ','Cars'],i:['กระเป๋า','Bag'],o:['ตั้งค่า','Settings']};
const NP=[
{id:0,n:['ป้าแมว','Aunt Maew'],x:11,y:8,o:{k:'#d9a577',hs:2,hc:'#e8e8e8',s:'#e0589a',h:0,a:0}},
{id:1,n:['ผู้ใหญ่สมชาย','Headman Somchai'],x:20,y:8,o:{k:'#a9744a',hs:3,hc:'#2a1c14',s:'#2b3f7a',h:0,a:2}},
{id:2,n:['ท่าน สส.ชูชาติ','MP Chuchart'],x:19,y:12,o:{k:'#d9a577',hs:0,hc:'#2a1c14',s:'#e8ece8',h:0,a:2}},
{id:3,n:['ลุงตุ๊ก','Uncle Tuk'],x:8,y:13,o:{k:'#6e4529',hs:3,hc:'#e8e8e8',s:'#f2c14e',h:2,a:0}},
{id:4,n:['ซานตี้','Santy'],x:17,y:8,o:{k:'#f1c9a0',hs:1,hc:'#e8e8e8',s:'#c8322f',h:1,a:0}}];
const GS=[['ได้ยินว่าผู้ใหญ่สั่งป้ายไวนิลใหม่ ทั้งที่ถนนยังเป็นหลุม','Heard the headman ordered a new banner while the road is still full of potholes.'],['สส.มาทีไร แจกถุงยังชีพทุกที แต่ก่อนเลือกตั้งนะ','Our MP only shows up with gift bags right before elections.'],['ตลาดคึกคักเพราะลูกสาวป้าไลฟ์ขายของ','The market is busy since my daughter started livestream sales.']];
const NW=[['สส.บอกจะมีรถไฟฟ้ามาถึงหน้าหมู่บ้าน ลุงรอมาสามสมัยแล้ว','MP says a metro line is coming to our village. I have waited three terms.'],['นโยบายใหม่ แจกเงินคนละพัน แต่ต้องไปรับที่อำเภอ ไกลกว่าเงินที่ได้อีก','New policy: 1,000 baht each, but collecting it costs more in fuel.'],['ถ้าฝนตกน้ำท่วม ผู้ใหญ่จะมาถ่ายรูปกับกระสอบทราย ทุกปีเลย','When it floods, the headman shows up for a sandbag photo. Every year.']];
// ---- state ----
function newS(){let r=7;const rn=()=>(r=r*16807%2147483647)/2147483647,mp=[];
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;if(x<1||y<1||x>W-2||y>H-2||(rn()<.07&&Math.hypot(x-15,y-12)>5))v=4;
if((y==9&&x>2&&x<29)||(x==15&&y>5&&y<19))v=1;if(x>=23&&x<=27&&y>=14&&y<=17)v=2;mp.push(v)}
mp[6*W+17]=5;
return{m:200,p:0,t:0,day:0,g:-1,hd:0,lg:/^th/.test(navigator.language)?0:1,sel:0,bd:-1,tab:'s',x:14,y:12,dr:0,ve:-1,ov:[],c:{},i:{},b:[[3,17,6]],mp,o:{h:[0],s:[0],a:[0]},w:{h:0,s:0,a:0,hs:0,hc:0,k:0}}}
try{S=Object.assign(newS(),JSON.parse(localStorage.getItem(SK)))}catch(e){S=newS()}
const sav=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
NP.forEach(n=>{n.hx=n.x;n.hy=n.y;n.dr=0;n.tm=0;n.vx=n.vy=0});
// ---- ui helpers ----
function tst(a){ts.textContent=t(a);ts.style.opacity=1;clearTimeout(tmo);tmo=setTimeout(()=>ts.style.opacity=0,2600);hud()}
function hud(){const d=20+S.day;$('#hm').textContent='฿'+S.m;$('#hp').textContent='★'+S.p+(S.hd?' '+t(['ผู้ใหญ่บ้าน','Headman']):'');$('#hd').textContent=d<32?t(['ธ.ค. ','Dec '])+d:t(['ม.ค. ','Jan '])+(d-31);
$('#hn').textContent=t(['WASD/ลูกศร เดิน · E/Space ทำงาน · M เมนู','WASD/Arrows move · E/Space act · M menu'])}
const P=()=>!mn.hidden||!dl.hidden;
function Cm(){mn.hidden=1}function cl(){dl.hidden=1}
function Lg(){S.lg^=1;document.documentElement.lang=S.lg?'en':'th';hud();if(!mn.hidden)M();sav()}
function show(nm,tx,ch){dl.hidden=0;CH=ch.map(x=>x[1]);dl.innerHTML='<b>'+t(nm)+'</b><p>'+t(tx)+'</p>'+ch.map((x,i)=>'<button onclick="CH['+i+']()">'+t(x[0])+'</button>').join('')+'<button onclick="cl()">✕</button>'}
function sell(){let a=0;for(const k in S.i)a+=S.i[k]*CR[k][3];S.i={};S.m+=a;sav();return a?['ขายได้ ฿'+a,'Sold for ฿'+a]:['ไม่มีผักให้ขาย','Nothing to sell']}
function spend(n,p,m){if(S.m<n)return['เงินไม่พอ','Not enough money'];S.m-=n;S.p+=p;return m}
function dlg(id,msg){const n=NP[id];let tx=msg,ch=[];const A=(l,f)=>ch.push([l,()=>{const r=f();dlg(id,r);hud();sav()}]);
if(id==0){tx=tx||['ผักสดๆ ป้ารับซื้อหมดจ้ะ! หน้าคริสต์มาสคนซื้อเยอะ','Fresh veg? I buy it all, dear! Xmas shoppers are everywhere.'];
A(['ฟังซุบซิบ (+1★)','Hear gossip (+1★)'],()=>{S.p++;return pick(GS)});A(['ขายผักทั้งหมด','Sell all veg'],sell)}
if(id==1){if(S.hd){tx=tx||['ท่านผู้ใหญ่! งบหมู่บ้านเข้า ฿30 ทุกวัน','Headman! The village budget pays you ฿30 a day.'];
A(['จัดประชุมหมู่บ้าน (฿50 +3★)','Hold a meeting (฿50 +3★)'],()=>spend(50,3,['ประชุมเสร็จ มีขนมแจกด้วย','Meeting done, snacks served.']))}
else{tx=tx||['อยากเป็นผู้ใหญ่บ้านเหรอ? ต้องมีฐานเสียง 60★ ขึ้นไป','Want my job? You need at least 60★ first.'];
if(S.p>=60)A(['สมัครผู้ใหญ่บ้าน (฿500)','Run for headman (฿500)'],()=>{if(S.m<500)return['เงินไม่พอค่าป้ายหาเสียง','Not enough for campaign signs'];S.m-=500;
if(S.p+Math.random()*40>=80){S.hd=1;S.p+=10;return['ชนะเลือกตั้ง! เป็นผู้ใหญ่บ้านแล้ว 🎉','You won! New headman 🎉']}S.p=Math.max(0,S.p-10);return['แพ้ไปนิดเดียว ชาวบ้านเงียบๆ...','Lost narrowly. Villagers are quiet...']});
A(['ช่วยซ่อมถนน (฿100 +5★)','Fix the road (฿100 +5★)'],()=>spend(100,5,['ถนนเรียบขึ้นแล้ว ชาวบ้านชื่นชม','Smoother road. Villagers approve.']))}}
if(id==2){tx=tx||['พี่น้องครับ ผมสัญญาว่าจะ... (ลืมไปแล้ว) รับซองขาวไหม?','Friends! I promise to... (forgot) — care for a white envelope?'];
A(['รับซอง ฿300 (-8★)','Take envelope ฿300 (-8★)'],()=>{S.m+=300;S.p=Math.max(0,S.p-8);return['ขอบคุณครับ เงียบๆ นะ... ชาวบ้านเริ่มซุบซิบ','Thanks, keep it quiet... villagers are whispering.']});
A(['ปฏิเสธ (+5★)','Decline (+5★)'],()=>{S.p+=5;return['ท่านเป็นคนมีหลักการ... น่าเสียดายจริงๆ','A man of principle... what a shame.']});
A(['ขอจัดตลาดนัดคริสต์มาส (฿200 +6★)','Request Xmas market (฿200 +6★)'],()=>spend(200,6,['ได้เลยครับ ผมจะไปตัดริบบิ้นเปิดงาน','Certainly! I will come cut the ribbon.']))}
if(id==3){tx=tx||pick(NW);A(['ฟังข่าวเมือง','Hear the news'],()=>pick(NW));A(['ดูรถ','See vehicles'],()=>{cl();M('v');return tx})}
if(id==4){tx=tx||['โฮ่ โฮ่ โฮ่! สุขสันต์วันคริสต์มาส','Ho ho ho! Merry Christmas!'];
if(S.g!==S.day)A(['รับของขวัญ','Take gift'],()=>{S.g=S.day;const a=S.day==5?500:50;S.m+=a;return['รับไปเลย ฿'+a+'!','Here, ฿'+a+'!']});else tx=['วันนี้รับไปแล้ว พรุ่งนี้มาใหม่นะ','Already got today’s gift. Come back tomorrow!']}
show(n.n,tx||'',ch)}
// ---- menu ----
function M(k){S.tab=k||S.tab;mn.hidden=0;K.l=K.r=K.u=K.d=0;let h='<div class="tb">'+Object.keys(TN).map(x=>'<button class="'+(x==S.tab?'on':'')+'" onclick="M(\''+x+'\')">'+t(TN[x])+'</button>').join('')+'<button onclick="Cm()">✕</button></div>',T_=S.tab;
if(T_=='s')h+=CR.map((r,i)=>`<button class="r ${S.sel==i?'on':''}" onclick="S.sel=${i};M()">${t(r)} · ฿${r[2]}→฿${r[3]} · ${r[4]}s</button>`).join('')+`<p>${t(['เลือกเมล็ด แล้วไถดิน (A) ที่หญ้า → ปลูก → เก็บเกี่ยว','Pick a seed. Face grass + A to till, A to plant, A to harvest.'])}</p>`;
if(T_=='b')h+=BD.map((b,i)=>`<button class="r" onclick="Bp(${i})">${t(b)} · ฿${b[2]}${b[3]?' · +฿'+b[3]+t(['/วัน','/day']):''} · ★${b[4]}</button>`).join('');
if(T_=='w'){h+=`<div style="display:flex;gap:10px;align-items:flex-start"><canvas id="pv" width="30" height="26" style="width:120px;height:104px;image-rendering:pixelated;background:#2b5a3a"></canvas><div><button class="o" onclick="Cy('hs',4)">${t(['ทรงผม','Hair'])}</button><button class="o" onclick="Cy('hc',5)">${t(['สีผม','Hair color'])}</button><button class="o" onclick="Cy('k',4)">${t(['สีผิว','Skin'])}</button></div></div>`;
[['h',HT,['หมวก','Hat']],['s',SH,['เสื้อผ้า','Clothes']],['a',AC,['เครื่องประดับ','Extras']]].forEach(([s,L,n])=>{h+='<p>'+t(n)+'</p>'+L.map((it,i)=>`<button class="o ${S.w[s]==i?'on':''}" onclick="Wb('${s}',${i})">${t(it)} ${S.o[s].includes(i)?'✓':'฿'+it[2]}</button>`).join('')})}
if(T_=='v')h+=VE.map((v,i)=>`<button class="r ${S.ve==i?'on':''}" onclick="Vb(${i})">${t(v)} · ${S.ov.includes(i)?'✓':'฿'+v[2]} · ×${v[3]}</button>`).join('')+`<button class="r" onclick="S.ve=-1;M()">${t(['เดินเท้า','On foot'])}</button>`;
if(T_=='i'){const ks=Object.keys(S.i).filter(k=>S.i[k]>0);h+=ks.length?ks.map(k=>`<div>${t(CR[k])} ×${S.i[k]} (฿${CR[k][3]})</div>`).join('')+`<button class="r" onclick="tst(sell());M()">${t(['ขายทั้งหมด','Sell all'])}</button>`:`<p>${t(['ยังไม่มีผักในกระเป๋า','Your bag is empty'])}</p>`}
if(T_=='o')h+=`<button class="r" onclick="Lg()">${t(['ภาษา: ไทย → English','Language: English → ไทย'])}</button><button class="r" onclick="sav();tst(['บันทึกแล้ว','Saved'])">${t(['บันทึกเกม','Save game'])}</button><button class="r" onclick="if(confirm('Reset?')){localStorage.removeItem(SK);location.reload()}">${t(['เริ่มใหม่','New game'])}</button><p>${t(['เกมบันทึกอัตโนมัติในเบราว์เซอร์นี้ · โหมดออนไลน์กับเพื่อนจะมาทีหลัง','Autosaves in this browser · co-op with friends comes later'])}</p>`;
$('#mb').innerHTML=h;if(T_=='w')pv()}
function pv(){const q=$('#pv').getContext('2d'),o=g;g=q;q.imageSmoothingEnabled=false;q.clearRect(0,0,30,26);ch(9,6,po(),0,0);g=o}
function po(){const w=S.w;return{k:SKN[w.k],hs:w.hs,hc:HC[w.hc],s:SH[w.s][3],h:w.h,a:w.a}}
function Cy(k,n){S.w[k]=(S.w[k]+1)%n;M()}
function Wb(s,i){const L={h:HT,s:SH,a:AC}[s];if(!S.o[s].includes(i)){if(S.m<L[i][2])return tst(['เงินไม่พอ','Not enough money']);S.m-=L[i][2];S.o[s].push(i)}S.w[s]=i;hud();sav();M()}
function Vb(i){if(!S.ov.includes(i)){if(S.m<VE[i][2])return tst(['เงินไม่พอ','Not enough money']);S.m-=VE[i][2];S.ov.push(i);S.p+=3}S.ve=i;hud();sav();M()}
function Bp(i){S.bd=i;Cm();tst(['หันหน้าไปที่หญ้าว่าง แล้วกด A เพื่อวาง','Face empty grass and press A to place'])}
function place(tx,ty){const b=BD[S.bd],z=b[5];
for(let a=0;a<z;a++)for(let d=0;d<z;d++){const x=tx+a,y=ty+d;if(x<0||y<0||x>=W||y>=H||S.mp[y*W+x]!=0)return tst(['วางตรงนี้ไม่ได้','Cannot build here'])}
const px=Math.floor(S.x+.5),py=Math.floor(S.y+.65);if(px>=tx&&px<tx+z&&py>=ty&&py<ty+z)return tst(['ถอยหลังก่อน','Step back first']);
if(S.m<b[2])return tst(['เงินไม่พอ','Not enough money']);
S.m-=b[2];S.p+=b[4];S.b.push([S.bd,tx,ty]);for(let a=0;a<z;a++)for(let d=0;d<z;d++)S.mp[(ty+d)*W+tx+a]=5;S.bd=-1;tst(['สร้างเสร็จ!','Built!']);sav()}
// ---- actions ----
const tgt=()=>[Math.floor(S.x+.5)+DX[S.dr],Math.floor(S.y+.65)+DY[S.dr]];
function act(){if(P())return;
const n=NP.find(n=>Math.hypot(n.x-S.x,n.y-S.y)<1.5);if(n){dlg(n.id);return}
const[tx,ty]=tgt();if(tx<0||ty<0||tx>=W||ty>=H)return;
if(S.bd>=0)return place(tx,ty);
const i=ty*W+tx,v=S.mp[i],k=tx+','+ty;
if(v==0){S.mp[i]=3;return}
if(v==3){const cr=S.c[k];
if(!cr){const p=CR[S.sel][2];if(S.m<p)return tst(['เงินไม่พอซื้อเมล็ด','Not enough money for seeds']);S.m-=p;S.c[k]={i:S.sel,t:S.t};hud();return}
const d=CR[cr.i];if(S.t-cr.t>=d[4]){S.i[cr.i]=(S.i[cr.i]||0)+1;delete S.c[k];tst(['เก็บเกี่ยว '+d[0]+'!','Harvested '+d[1]+'!'])}else tst(['ยังไม่โต','Not ready yet'])}}
function daily(){let a=S.hd?30:0;S.b.forEach(b=>a+=BD[b[0]][3]);S.m+=a;
if(S.day==5)tst(['🎄 สุขสันต์วันคริสต์มาส! ไปรับของขวัญจากซานตี้','🎄 Merry Christmas! Visit Santy for a gift']);else if(a)tst(['รายได้วันนี้ ฿'+a,'Daily income ฿'+a]);sav()}
// ---- world ----
const solid=(x,y)=>{const a=Math.floor(x),b=Math.floor(y);if(a<0||b<0||a>=W||b>=H)return 1;const v=S.mp[b*W+a];return v==2||v==4||v==5};
const blk=(x,y)=>solid(x+.2,y+.6)||solid(x+.8,y+.6)||solid(x+.2,y+.95)||solid(x+.8,y+.95);
function up(dt){S.t+=dt;const nd=Math.floor(S.t/60);while(S.day<nd){S.day++;daily()}
let dx=K.r-K.l,dy=K.d-K.u;
if(dx||dy){const l=Math.hypot(dx,dy),sp=3*(S.ve>=0?VE[S.ve][3]:1)*dt;dx=dx/l*sp;dy=dy/l*sp;
S.dr=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3);
if(!blk(S.x+dx,S.y))S.x+=dx;if(!blk(S.x,S.y+dy))S.y+=dy}
S.mv=!!(dx||dy);
NP.forEach(n=>{n.tm-=dt;if(n.tm<=0){n.tm=1+Math.random()*2;const d=pick([[0,0],[1,0],[-1,0],[0,1],[0,-1]]);n.vx=d[0];n.vy=d[1];if(d[0]||d[1])n.dr=d[1]>0?0:d[1]<0?3:d[0]<0?1:2}
const nx=n.x+n.vx*dt,ny=n.y+n.vy*dt;if(!blk(nx,ny)&&Math.hypot(nx-n.hx,ny-n.hy)<3){n.x=nx;n.y=ny}else{n.vx=n.vy=0}});
sn.forEach(f=>{f.y+=f.s*dt*18;f.x+=Math.sin(S.t+f.s*9)*dt*6;if(f.y>192){f.y=-2;f.x=Math.random()*320}});
if(fr%15==0)hud()}
// ---- drawing ----
function tree(p,q,d){R(p+7,q+11,2,5,'#5a3a1e');R(p+2,q+8,12,4,'#1f6b34');R(p+4,q+4,8,5,'#25803d');R(p+6,q+1,4,4,'#1f6b34');R(p+5,q+4,3,1,'#fff');R(p+3,q+8,2,1,'#fff');
if(d){R(p+7,q-2,2,2,'#f2c14e');R(p+5,q+6,1,1,'#f33');R(p+10,q+9,1,1,'#fd0');R(p+4,q+10,1,1,'#39f');R(p+8,q+4,1,1,'#f33')}}
function rf(p,q,col,n,dw,w0){for(let k=0;k<n;k++){const w=w0+k*dw;R(p+16-w/2,q+2+k*2,w,2,col)}}
function bld(b){const p=b[1]*T-cx,q=b[2]*T-cy,i=b[0],bl=fr>>5&1;
if(i==3)return tree(p,q,1);
if(i==0){R(p+1,q+14,30,16,'#b9824a');for(let k=0;k<5;k++)R(p+k*6+1,q+8,6,6,k%2?'#fff':'#c8322f');R(p+3,q+14,26,2,'#8f5e30');R(p+6,q+20,6,5,'#f08a24');R(p+14,q+20,6,5,'#e0282e');R(p+22,q+20,5,5,'#3fbf5a');return}
if(i==1){rf(p,q,'#9b2f2a',7,4,4);R(p+14,q+2,4,2,'#fff');R(p+12,q+4,8,1,'#fff');R(p+4,q+14,24,16,'#d9a066');R(p+13,q+21,6,9,'#5a3a1e');R(p+6,q+19,5,5,'#ffe9a8');R(p+21,q+19,5,5,'#ffe9a8');for(let k=0;k<6;k++)R(p+3+k*5,q+13,2,2,(k+bl)%2?'#f2c14e':'#f33');return}
rf(p,q,'#7a3b1e',7,4,2);R(p+15,q,2,3,'#f2c14e');R(p+5,q+13,22,1,'#f2c14e');R(p+6,q+14,20,9,'#b27a3c');R(p+8,q+16,4,4,'#ffe9a8');R(p+20,q+16,4,4,'#ffe9a8');R(p+7,q+23,2,7,'#5a3a1e');R(p+23,q+23,2,7,'#5a3a1e');R(p+14,q+23,4,2,'#8f5e30');R(p+14,q+13,4,1,'#fff')}
function ch(x,y,o,dr,mv){const b=mv&&(fr>>3&1)?1:0;y-=b;
R(x+3,y+11,2,4,'#2a2018');R(x+7,y+11,2,4,'#2a2018');R(x+2,y+6,8,6,o.s);R(x+1,y+7,1,4,o.k);R(x+10,y+7,1,4,o.k);R(x+3,y+1,6,6,o.k);
R(x+3,y,6,o.hs==3?1:2,o.hc);if(o.hs==1){R(x+2,y,1,8,o.hc);R(x+9,y,1,8,o.hc)}if(o.hs==2)R(x+5,y-2,2,2,o.hc);
if(dr==3)R(x+3,y,6,5,o.hc);else{const e=[4,3,6][dr==0?0:dr],f=dr==0?7:dr==1?5:8;R(x+e,y+3,1,1,'#222');R(x+f,y+3,1,1,'#222')}
const h=o.h;
if(h==1){R(x+2,y-2,8,3,'#c8322f');R(x+2,y+1,8,1,'#fff');R(x+9,y-3,2,2,'#fff')}
if(h==2){R(x,y,12,1,'#d8b45a');R(x+2,y-2,8,2,'#e6c673');R(x+5,y-3,2,1,'#e6c673')}
if(h==3){R(x+1,y-3,1,4,'#7a4a24');R(x+10,y-3,1,4,'#7a4a24');R(x,y-3,1,1,'#7a4a24');R(x+11,y-3,1,1,'#7a4a24')}
if(h==4){R(x+3,y-1,6,3,'#2f8f4a');R(x+5,y-2,2,1,'#fff')}
if(h==5){R(x+3,y-1,6,2,'#f2c14e');R(x+3,y-2,1,1,'#f2c14e');R(x+5,y-2,2,1,'#f2c14e');R(x+8,y-2,1,1,'#f2c14e')}
if(o.a==1){R(x+2,y+6,8,2,'#c8322f');R(x+8,y+8,2,3,'#c8322f')}
if(o.a==2&&dr!=3)R(x+3,y+3,6,1,'#111');
if(o.a==3){const z=fr>>4&1;R(x+2,y+8,1,1,z?'#ff0':'#f33');R(x+4,y+9,1,1,z?'#f33':'#3f3');R(x+6,y+9,1,1,z?'#3f3':'#39f');R(x+8,y+8,1,1,z?'#39f':'#ff0')}}
function tile(x,y){const v=S.mp[y*W+x],p=x*T-cx,q=y*T-cy;
if(v==2){R(p,q,T,T,'#3b7bbf');R(p+3+((fr>>4)+x)%3*3,q+5,5,1,'#8fc3ee');return}
R(p,q,T,T,v==1?'#c9b48a':v==3?'#6b4528':'#4f9a4a');
if(v==0||v==5){if((x*7+y*13)%5==0)R(p+3,q+4,2,1,'#62b05a');if((x*11+y*7)%9==0)R(p+9,q+10,3,2,'#f4f8f4')}
if(v==1&&(x*5+y*3)%4==0)R(p+4,q+8,2,1,'#b39c70');
if(v==3)for(let i=3;i<T;i+=5)R(p+1,q+i,14,1,'#55361f');
if(v==4)tree(p,q)}
function draw(){cx=Math.max(0,Math.min(W*T-VW*T,Math.round(S.x*T+8-VW*T/2)));cy=Math.max(0,Math.min(H*T-VH*T,Math.round(S.y*T+8-VH*T/2)));
const x0=cx/T|0,y0=cy/T|0;
for(let y=y0;y<=y0+VH&&y<H;y++)for(let x=x0;x<=x0+VW&&x<W;x++)if(S.mp[y*W+x]!=4)tile(x,y);
for(const k in S.c){const[x,y]=k.split(',').map(Number),cr=S.c[k],d=CR[cr.i],p=x*T-cx,q=y*T-cy,r=(S.t-cr.t)/d[4];
if(r<.34)R(p+7,q+10,2,3,'#3fbf5a');else if(r<1){R(p+6,q+7,4,6,'#3fbf5a');R(p+4,q+9,2,2,'#2f8f3a');R(p+10,q+9,2,2,'#2f8f3a')}
else{R(p+4,q+6,8,7,'#2f8f3a');R(p+5,q+7,2,2,d[5]);R(p+9,q+9,2,2,d[5]);R(p+7,q+5,2,2,d[5])}}
const sp=[];
for(let y=y0;y<=y0+VH&&y<H;y++)for(let x=x0;x<=x0+VW&&x<W;x++)if(S.mp[y*W+x]==4)sp.push([(y+1)*T,()=>tile(x,y)]);
S.b.forEach(b=>sp.push([(b[2]+BD[b[0]][5])*T,()=>bld(b)]));
NP.forEach(n=>sp.push([(n.y+1)*T,()=>ch(n.x*T-cx+2,n.y*T-cy,n.o,n.dr,n.vx||n.vy)]));
sp.push([(S.y+1)*T,()=>{const x=S.x*T-cx+2,y=S.y*T-cy;ch(x,y,po(),S.dr,S.mv);if(S.ve>=0){const v=VE[S.ve];R(x-2,y+10,16,4,v[4]);R(x-1,y+13,3,3,'#111');R(x+10,y+13,3,3,'#111')}}]);
sp.sort((a,b)=>a[0]-b[0]).forEach(s=>s[1]());
const[tx,ty]=tgt(),z=S.bd>=0?BD[S.bd][5]:1;g.strokeStyle='#f2c14e';g.lineWidth=1;g.strokeRect(tx*T-cx+.5,ty*T-cy+.5,z*T-1,z*T-1);
sn.forEach(f=>R(f.x,f.y,f.s>1.3?2:1,f.s>1.3?2:1,'#fff'))}
function loop(ms){const dt=Math.min(.1,(ms-(lt||ms))/1e3);lt=ms;fr++;if(!P())up(dt);draw();requestAnimationFrame(loop)}
// ---- input ----
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d'};
onkeydown=e=>{if(KM[e.code]){K[KM[e.code]]=1;e.preventDefault()}else if(e.code=='KeyE'||e.code=='Space'){e.preventDefault();act()}else if(e.code=='KeyM')mn.hidden?M():Cm();else if(e.code=='Escape'){Cm();cl()}};
onkeyup=e=>{if(KM[e.code])K[KM[e.code]]=0};
document.querySelectorAll('.dp [data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>K[k]=0;b.oncontextmenu=e=>e.preventDefault()});
for(let i=0;i<50;i++)sn.push({x:Math.random()*320,y:Math.random()*192,s:.6+Math.random()*1.2});
document.documentElement.lang=S.lg?'en':'th';hud();
tst(['🎄 เดินไปคุยกับชาวบ้าน · ไถดิน ปลูก เก็บผัก ด้วยปุ่ม A','🎄 Talk to villagers · till, plant, harvest with the A button']);
